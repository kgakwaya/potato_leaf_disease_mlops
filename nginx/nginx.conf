# Round-robin load balancer in front of the scaled `api` containers.
# Docker's DNS returns one IP per api replica; nginx resolves them at start-up,
# so run `docker compose restart nginx` after changing the number of replicas.
events {}
http {
    client_max_body_size 200M;
    upstream potato_api {
        server api:8000;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://potato_api;
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
