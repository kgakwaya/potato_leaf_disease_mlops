# Start with N API containers behind an nginx load balancer:
#   docker compose up --build -d --scale api=3
# UI + API: http://localhost:8080
services:
  api:
    build: .
    user: root   # so the containers can write to the bind-mounted ./data and ./models on any host
    environment:
      - PORT=8000
      - WEB_CONCURRENCY=1
    volumes:
      # Shared between replicas so uploads, the database and retrained models
      # are visible to every container.
      - ./models:/app/models
      - ./data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
